name: Android APK

# 在 GitHub 的 Linux 运行器上编译出**未签名**的 release APK。
# 签名同样由你在本地完成（本仓库不接触 keystore）。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-unsigned-apk.yml'

jobs:
  build-android:
    name: 编译 Android（不签名）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: app

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查 Flutter 工程是否存在
        id: check
        working-directory: .
        run: |
          if [ ! -f app/pubspec.yaml ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::app/pubspec.yaml 不存在，跳过构建。请先用 flutter create 生成工程。"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 JDK 17
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        if: steps.check.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: 拉取依赖
        if: steps.check.outputs.exists == 'true'
        run: flutter pub get

      - name: 代码检查（不阻断构建）
        if: steps.check.outputs.exists == 'true'
        continue-on-error: true
        run: flutter analyze

      - name: 编译 APK（release，未签名）
        if: steps.check.outputs.exists == 'true'
        run: |
          # 不传 --dart-define：app/lib/data/providers/providers.dart 里的默认值
          # 已指向生产服务器，这样 CI 出的 APK 装到手机即可用。
          # 需要指向别处时，在仓库 Settings → Variables 配 API_BASE_URL。
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            flutter build apk --release --split-per-abi --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}"
          else
            flutter build apk --release --split-per-abi
          fi

      - name: 计算校验值
        if: steps.check.outputs.exists == 'true'
        run: |
          cd build/app/outputs/flutter-apk
          ls -lh *.apk
          shasum -a 256 *.apk | tee SHA256SUMS.txt

      - name: 上传产物
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-apk
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error